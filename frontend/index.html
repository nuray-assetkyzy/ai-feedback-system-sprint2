<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Feedback System — Submit Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container header-inner">
            <h1>🎓 AI Feedback System</h1>
            <nav>
                <a href="index.html" class="active">Submit Feedback</a>
                <a href="admin.html">Admin Panel</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <section class="hero">
            <h2>Share Your Feedback</h2>
            <p>Your feedback helps us improve the education process. AI will analyze it automatically.</p>
        </section>

        <!-- FEEDBACK FORM -->
        <section class="card">
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="studentName">Your Full Name</label>
                    <input type="text" id="studentName" placeholder="e.g., Aigul Serikkyzy" required>
                </div>

                <div class="form-group">
                    <label for="topic">Select Topic</label>
                    <select id="topic" required>
                        <option value="">— Choose a topic —</option>
                        <option value="Teacher">👨‍🏫 Teacher</option>
                        <option value="Library">📚 Library</option>
                        <option value="Schedule">📅 Schedule</option>
                        <option value="Cafeteria">🍽️ Cafeteria</option>
                        <option value="Dormitory">🏠 Dormitory</option>
                        <option value="Other">📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="feedbackText">Your Feedback</label>
                    <textarea id="feedbackText" rows="5" placeholder="Write your feedback here..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">📤 Submit Feedback</button>
            </form>

            <div id="analysisResult"></div>
            <div id="successMsg" class="success-msg"></div>
        </section>

        <!-- RECENT FEEDBACKS -->
        <section class="card">
            <h3>📝 Recent Feedbacks</h3>
            <div id="recentFeedbacks"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 AI Feedback System | Sprint 2 — NLP & Database</p>
    </footer>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
