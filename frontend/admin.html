<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Feedback System — Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container header-inner">
            <h1>🎓 AI Feedback System</h1>
            <nav>
                <a href="index.html">Submit Feedback</a>
                <a href="admin.html" class="active">Admin Panel</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- LOGIN -->
        <section id="loginSection" class="card login-card">
            <h2>🔐 Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUser">Username</label>
                    <input type="text" id="loginUser" placeholder="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPass">Password</label>
                    <input type="password" id="loginPass" placeholder="••••" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
                <p id="loginError" class="error-msg"></p>
            </form>
            <p class="hint">Contact administrator for access credentials</p>
        </section>

        <!-- ADMIN PANEL -->
        <section id="adminPanel" class="hidden">
            <div class="card">
                <div class="admin-header">
                    <h2>📊 All Feedbacks</h2>
                    <button id="logoutBtn" class="btn-danger">Logout</button>
                </div>

                <div class="stats stats-wide">
                    <div class="stat-box">
                        <span class="stat-num" id="totalCount">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="todayCount">0</span>
                        <span class="stat-label">Today</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="positiveCount">0</span>
                        <span class="stat-label">Positive</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="negativeCount">0</span>
                        <span class="stat-label">Negative</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="neutralCount">0</span>
                        <span class="stat-label">Neutral</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="avgIntensity">—</span>
                        <span class="stat-label">Avg Intensity</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="topicCount">0</span>
                        <span class="stat-label">Topics</span>
                    </div>
                </div>

                <div class="filters-row">
                <div class="form-group">
                    <label>Filter by Topic:</label>
                    <select id="filterTopic">
                        <option value="">All</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Library">Library</option>
                        <option value="Schedule">Schedule</option>
                        <option value="Cafeteria">Cafeteria</option>
                        <option value="Dormitory">Dormitory</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Filter by Sentiment:</label>
                    <select id="filterSentiment">
                        <option value="">All</option>
                        <option value="positive">Positive</option>
                        <option value="negative">Negative</option>
                        <option value="neutral">Neutral</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Filter by Language:</label>
                    <select id="filterLanguage">
                        <option value="">All</option>
                        <option value="en">English</option>
                        <option value="ru">Russian</option>
                        <option value="kk">Kazakh</option>
                        <option value="unknown">Unknown</option>
                    </select>
                </div>
                </div>
            </div>

            <div id="feedbackList"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 AI Feedback System | Sprint 2 — NLP & Database</p>
    </footer>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
